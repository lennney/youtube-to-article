[project]
name = "youtube-to-article"
version = "0.2.0"
description = "YouTube video → structured DIY article — yt-dlp + deno n-challenge + LLM rewrite + frame extraction + WebP + SEO + Schema.org HTML. Full pipeline for AI agents."
authors = [{ name = "lennney" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "jinja2>=3.0",
    "markdown>=3.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ytarticle = "ytarticle.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytarticle"]
